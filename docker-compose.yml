version: '3.8'
services:
  vincentbuilds:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./runtime:/app/runtime
      - ./vector_index:/app/vector_index
      - ./data:/app/data
      # 挂载宿主机已缓存的 embedding 模型，避免容器启动联网下载
      - /root/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
